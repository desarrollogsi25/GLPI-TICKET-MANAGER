name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore GlpiTicketManager.sln
      - name: Build
        run: dotnet build GlpiTicketManager.sln --no-restore -c Release
      - name: Test
        run: dotnet test tests/GlpiTicketManager.Application.Tests --no-build -c Release --verbosity normal

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  e2e:
    name: E2E (Playwright against full stack)
    runs-on: ubuntu-latest
    needs: [backend, frontend]  # solo corre si los otros pasan
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Create .env for compose
        run: |
          cat > .env <<EOF
          MARIADB_ROOT_PASSWORD=${{ secrets.MARIADB_ROOT_PASSWORD || 'ci-root-password' }}
          MARIADB_DATABASE=glpi
          MARIADB_USER=glpi
          MARIADB_PASSWORD=${{ secrets.MARIADB_PASSWORD || 'ci-glpi-password' }}
          GLPI_APP_TOKEN=${{ secrets.GLPI_APP_TOKEN || 'ci-app-token-placeholder-40-chars-long-xxxx' }}
          GLPI_USER_TOKEN=${{ secrets.GLPI_USER_TOKEN || 'ci-user-token-placeholder-40-chars-long-xxx' }}
          JWT_SECRET=${{ secrets.JWT_SECRET || 'ci-jwt-secret-placeholder-32-chars-min-x' }}
          EOF
      - name: Start database
        run: docker compose up -d glpi-db
      - name: Wait for database healthy
        run: |
          for i in {1..30}; do
            if docker compose exec -T glpi-db healthcheck.sh --connect --innodb_initialized > /dev/null 2>&1; then
              echo "Database is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "Database failed to become healthy"
          exit 1
      - name: Apply GLPI base schema (CI bootstrap)
        run: |
          MARIADB_PASSWORD=$(grep '^MARIADB_PASSWORD=' .env | cut -d '=' -f2-)
          docker compose exec -T glpi-db mariadb -u glpi -p"${MARIADB_PASSWORD}" glpi < scripts/glpi-base.sql
      - name: Start full stack
        run: docker compose up -d --build
      - name: Copy GLPI configuration and encryption key
        run: |
          MARIADB_PASSWORD=$(grep '^MARIADB_PASSWORD=' .env | cut -d '=' -f2-)
          sed -i "s/public \$dbpassword = '.*';/public \$dbpassword = '${MARIADB_PASSWORD}';/" scripts/config_db.php
          docker compose cp scripts/glpicrypt.key glpi:/var/glpi/config/glpicrypt.key
          docker compose cp scripts/config_db.php glpi:/var/glpi/config/config_db.php
          docker compose restart glpi
          sleep 5
      - name: Wait for API healthy
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:8080/health > /dev/null; then exit 0; fi
            sleep 2
          done
          echo "API did not become healthy"
          docker compose logs api
          exit 1
      - name: Wait for frontend
        run: |
          for i in {1..30}; do
            if curl -sf http://localhost:5173 > /dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Seed E2E state
        run: ./scripts/seed-e2e.sh
      - name: Install Playwright browsers
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E
        working-directory: frontend
        run: pnpm exec playwright test --reporter=list
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Tear down stack
        if: always()
        run: docker compose down -v
