name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  backend:
    name: Backend (build + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - '!docs/**'
              - '!frontend/**'
      - uses: actions/setup-dotnet@v4
        if: steps.filter.outputs.backend == 'true'
        with:
          dotnet-version: '10.0.x'
      - name: Cache NuGet packages
        if: steps.filter.outputs.backend == 'true'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      - name: Restore
        if: steps.filter.outputs.backend == 'true'
        run: dotnet restore GlpiTicketManager.sln
      - name: Build
        if: steps.filter.outputs.backend == 'true'
        run: dotnet build GlpiTicketManager.sln --no-restore -c Release
      - name: Test
        if: steps.filter.outputs.backend == 'true'
        run: dotnet test tests/GlpiTicketManager.Application.Tests --no-build -c Release --verbosity normal
      - name: Run integration tests
        if: steps.filter.outputs.backend == 'true'
        run: dotnet test tests/GlpiTicketManager.Api.Integration.Tests -c Release
      - name: Skip Backend notice
        if: steps.filter.outputs.backend != 'true'
        run: echo "No backend changes detected. Skipping .NET restore, build, and tests."

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - '!docs/**'
              - '!src/**'
              - '!tests/GlpiTicketManager.**'
      - uses: pnpm/action-setup@v4
        if: steps.filter.outputs.frontend == 'true'
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        if: steps.filter.outputs.frontend == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        if: steps.filter.outputs.frontend == 'true'
      - run: pnpm typecheck
        if: steps.filter.outputs.frontend == 'true'
      - run: pnpm build
        if: steps.filter.outputs.frontend == 'true'
      - name: Skip Frontend notice
        if: steps.filter.outputs.frontend != 'true'
        run: echo "No frontend changes detected. Skipping typecheck and build."

  e2e:
    name: E2E (Playwright against full stack)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [backend, frontend, secret-scan]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Test reset guard without Docker
        run: node --test scripts/e2e/guard.test.mjs
      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile
      - name: Test entrypoints without Docker or browser
        run: |
          node --test scripts/e2e/negative-entrypoints.test.mjs scripts/e2e/runner-cleanup.test.mjs
          bash -n scripts/seed-e2e.sh scripts/test-audit.sh
          for script in scripts/seed-e2e.sh scripts/test-audit.sh; do
            if env -u E2E_FIXTURE_MANIFEST bash "$script"; then
              echo "ERROR: unverified reset entrypoint was accepted"
              exit 1
            fi
          done
          if env -u E2E_FIXTURE_MANIFEST node scripts/seed-visual-forms.js; then
            echo "ERROR: unverified visual fixture entrypoint was accepted"
            exit 1
          fi
      - name: Install browser on ephemeral runner
        run: pnpm --dir frontend exec playwright install --with-deps chromium
      - name: Run disposable full-stack fixture
        # Creates unique resources and synthetic secrets, verifies identity before
        # writes, and removes only its own resources in finally. Never uses .env.
        run: node scripts/e2e/run.mjs
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-artifacts
          path: |
            frontend/e2e-artifacts/*/playwright-report/
            frontend/e2e-artifacts/*/test-results/
          if-no-files-found: warn
          retention-days: 7
