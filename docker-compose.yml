services:
  glpi:
    image: glpi/glpi:11.0
    container_name: glpi
    restart: unless-stopped
    volumes:
      # The official glpi/glpi:11.0 image declares ONE volume at /var/glpi
      # (config, files, logs and marketplace all live under it), exactly like the
      # official docker-compose.example.yml. Mounting it as a single named volume
      # lets Docker initialise it from the image (owned by www-data) and avoids
      # the "Permission denied" on startup.
      # Do NOT mount /var/glpi/config, /var/glpi/files, ... individually: those
      # paths do not exist in the image, so Docker creates the mountpoints as
      # root:root and the www-data entrypoint cannot write to them.
      - glpi-data:/var/glpi
      - glpi-plugins:/var/www/glpi/plugins
    ports:
      - 127.0.0.1:8081:80
    depends_on:
      glpi-db:
        condition: service_healthy

  glpi-db:
    image: mariadb:10.11
    container_name: glpi-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER: ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    volumes:
      - glpi-db-data:/var/lib/mysql
    ports:
      - 127.0.0.1:3306:3306
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  # .NET 9 API. Reads MariaDB directly (Dapper) and writes through GLPI's REST API.
  # Inside the compose network it reaches GLPI by its service name (`glpi`, port 80)
  # and the database by `glpi-db:3306` — never via the host loopback ports.
  api:
    build:
      context: .
      dockerfile: src/GlpiTicketManager.Api/Dockerfile
    container_name: glpi-api
    restart: unless-stopped
    depends_on:
      glpi-db:
        condition: service_healthy
      glpi:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ConnectionString: "Server=glpi-db;Port=3306;Database=${MARIADB_DATABASE};User=${MARIADB_USER};Password=${MARIADB_PASSWORD};"
      GlpiApi__BaseUrl: "http://glpi/apirest.php/"
      GlpiApi__AppToken: "${GLPI_APP_TOKEN}"
      GlpiApi__UserToken: "${GLPI_USER_TOKEN}"
      Jwt__Key: "${JWT_SECRET}"
    ports:
      - "127.0.0.1:8080:8080"

  # React 19 + Vite dev server (hot reload). The container talks to the API by its
  # service name too: the browser calls same-origin `/api`, Vite proxies to api:8080.
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: glpi-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: "/api"
      VITE_PROXY_TARGET: "http://api:8080"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      # Bind-mount the sources for hot reload; keep the container's node_modules
      # (installed at build time) from being shadowed by the host directory.
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - api

  # PostgreSQL for own data (ADR-012). Isolated from GLPI's MariaDB.
  app-db:
    image: postgres:16-alpine
    container_name: glpi-app-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: glpi_ticket_manager
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD}
    volumes:
      - app-db-data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "app", "-d", "glpi_ticket_manager"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  glpi-db-data:
  glpi-data:
  glpi-plugins:
  app-db-data:
