# Production Docker Stack (H-19)
# Reference: ISO 27001 A.14.2 & OWASP Secure Deployment

services:
  # ---------------------------------------------------------------------------
  # Application Database (PostgreSQL 17 for internal roles, auth, audit)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: glpi-ticket-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-glpi_ticket_manager}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-glpi_ticket_manager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal-net

  # ---------------------------------------------------------------------------
  # Backend API (.NET 10 Multi-Stage Runtime, Unprivileged Non-Root)
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: src/GlpiTicketManager.Api/Dockerfile
    container_name: glpi-ticket-manager-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionString: "Server=${GLPI_DB_HOST:-glpi-db};Port=${GLPI_DB_PORT:-3306};Database=${GLPI_DB_NAME:-glpi};User=${GLPI_DB_USER:-glpi};Password=${GLPI_DB_PASSWORD};"
      AppDb__ConnectionString: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-glpi_ticket_manager};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};"
      GlpiApi__BaseUrl: ${GLPI_API_BASE_URL:-http://glpi:80/apirest.php}
      GlpiApi__AppToken: ${GLPI_APP_TOKEN}
      GlpiApi__UserToken: ${GLPI_USER_TOKEN}
      Jwt__Key: ${JWT_SECRET}
      Jwt__Issuer: ${JWT_ISSUER:-GlpiTicketManager}
      Jwt__Audience: ${JWT_AUDIENCE:-GlpiTicketManager}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-480}
      Seq__ServerUrl: ${SEQ_SERVER_URL:-http://seq:5341}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - internal-net

  # ---------------------------------------------------------------------------
  # Frontend & Reverse Proxy (Hardened Nginx Alpine + React SPA)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: glpi-ticket-manager-frontend
    restart: unless-stopped
    ports:
      - "${PROD_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - internal-net

  # ---------------------------------------------------------------------------
  # Structured Logging Server (Seq - Optional Centralized Telemetry)
  # ---------------------------------------------------------------------------
  seq:
    image: datalust/seq:latest
    container_name: glpi-ticket-manager-seq
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORDHASH: ${SEQ_ADMIN_PASSWORD_HASH:-}
    volumes:
      - seq_data:/data
    ports:
      - "127.0.0.1:${SEQ_PORT:-5341}:80"
    networks:
      - internal-net

volumes:
  postgres_data:
    driver: local
  seq_data:
    driver: local

networks:
  internal-net:
    driver: bridge
