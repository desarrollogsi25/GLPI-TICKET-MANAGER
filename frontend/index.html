<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GLPI Ticket Manager</title>
    <meta name="description" content="Gestión de tickets de GLPI 11" />
    <link rel="icon" href="/favicon.ico" />
    <!--
      Anti-FOUC: aplica la clase `dark` y `data-theme` antes del primer pintado.
      Debe ser un fichero externo y no un bloque embebido en la pagina: la CSP de
      nginx es `script-src 'self'`, que no permite codigo inline y no se relaja
      con `unsafe-inline` a proposito. Un script propio se sirve como mismo origen
      y por lo tanto pasa la directiva.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
